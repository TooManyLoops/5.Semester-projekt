<div class="page">

    <div class="page-header">
        <h1>Medarbejdere</h1>

        <button class="add-button" routerLink="/employees/create">
            Tilføj ny medarbejdere
        </button>
    </div>

    <div class="filter-row">
        <label>Find medarbejder:</label>

        <select [(ngModel)]="selectedLetter" name="selectedLetter" (change)="onLetterChange()">

            <option value="">Alle</option>

            <option *ngFor="let letter of letters" [value]="letter">
                {{ letter }}
            </option>

        </select>
    </div>

    <table class="employee-table">
        <thead>
            <tr>
                <th>Navn</th>
                <th>Email</th>
                <th>Telefon nummer</th>
                <th>Roller</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let emp of pageEmployees">
                <td>{{ emp.firstName }} {{ emp.lastName }}</td>
                <td>{{ emp.email }}</td>
                <td>{{ emp.phoneNumber }}</td>
                <td>{{ emp.rolesText || 'Ingen rolle' }}</td>
                <td>{{ getStatusText(emp.employeeStatus) }}</td>
                <td>
                    <button class="edit-button" [routerLink]="['/employees/edit', emp.employeeId]">
                        <i class="bi bi-pencil"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="pagination">

        <button (click)="goToFirstPage()" [disabled]="currentPage === 1">
            Første
        </button>

        <button (click)="goToPreviousPage()" [disabled]="currentPage === 1">
            Tilbage
        </button>

        <span>
            Side {{ currentPage }} af {{ totalPages || 1 }}
        </span>

        <button (click)="goToNextPage()" [disabled]="currentPage === totalPages || totalPages === 0">
            Frem
        </button>

        <button (click)="goToLastPage()" [disabled]="currentPage === totalPages || totalPages === 0">
            Sidste
        </button>

    </div>

</div>
