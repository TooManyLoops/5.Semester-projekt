<div class="page">

    <h1>Ledige vagter</h1>

    <div *ngIf="selectedShift" class="assign-box">

        <h2>Tilmeld ledig vagt</h2>

        <div class="form-row">
            <label>Rolle</label>
            <input type="text" [value]="selectedShift.roleName" readonly>
        </div>

        <div class="form-row">
            <label>Medarbejder</label>

            <select [(ngModel)]="selectedEmployeeId" name="selectedEmployeeId">
                <option value="">Vælg medarbejder</option>

                <option *ngFor="let employee of employees" [value]="employee.employeeId">
                    {{ employee.firstName }} {{ employee.lastName }}
                </option>
            </select>
        </div>

        <div class="button-row">
            <button class="join-button" type="button" (click)="confirmJoinShift()">
                Bekræft tilmelding
            </button>

            <button class="cancel-button" type="button" (click)="selectedShift = null">
                Annuller
            </button>
        </div>

    </div>

    <table class="shift-table">

        <thead>
            <tr>
                <th>Rolle</th>
                <th>Dato</th>
                <th>Tid</th>
                <th>Handling</th>
            </tr>
        </thead>

        <tbody>

            <tr *ngFor="let shift of openShifts">

                <td>{{ shift.roleName }}</td>

                <td>{{ formatDate(shift.startTime) }}</td>

                <td>
                    {{ formatTime(shift.startTime) }}
                    -
                    {{ formatTime(shift.endTime) }}
                </td>

                <td>
                    <button class="join-button" (click)="selectedShift = shift">
                        Tilmeld vagt
                    </button>
                </td>

            </tr>

        </tbody>

    </table>

</div>
