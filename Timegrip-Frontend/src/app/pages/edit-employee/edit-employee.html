<div class="page">

    <h1>Rediger medarbejder</h1>

    <form class="employee-form" (ngSubmit)="updateEmployee()">

        <div class="form-row">
            <label>First name</label>
            <input type="text" [(ngModel)]="employee.firstName" name="firstName">
        </div>

        <div class="form-row">
            <label>Last name</label>
            <input type="text" [(ngModel)]="employee.lastName" name="lastName">
        </div>

        <div class="form-row">
            <label>Email</label>
            <input type="text" [(ngModel)]="employee.email" name="email">
        </div>

        <div class="form-row">
            <label>Phone number</label>
            <input type="text" [(ngModel)]="employee.phoneNumber" name="phoneNumber">
        </div>

        <div class="form-row">
            <label>Status</label>

            <select [(ngModel)]="employee.employeeStatus" name="employeeStatus">
                <option [ngValue]="1">Active</option>
                <option [ngValue]="2">Inactive</option>
                <option [ngValue]="3">Terminated</option>
                <option [ngValue]="4">On Leave</option>
            </select>
        </div>

        <div class="button-row">
            <button type="submit">Save changes</button>
        </div>

    </form>

    <hr>

    <h2>Roller</h2>

    <div class="role-section">

        <h3>Nuværende roller</h3>

        <ul>
            <li *ngFor="let employeeRole of employeeRoles">
                {{ getRoleName(employeeRole.roleId) }}
            </li>
        </ul>

        <div class="form-row">
            <label>Tilføj rolle</label>

            <select [(ngModel)]="selectedRoleId" name="selectedRoleId">
                <option value="">Vælg rolle</option>

                <option *ngFor="let role of roles" [value]="role.roleId">
                    {{ role.name }}
                </option>
            </select>
        </div>

        <div class="button-row">
            <button type="button" (click)="addRoleToEmployee()">
                Tilføj rolle
            </button>
        </div>

    </div>

</div>
