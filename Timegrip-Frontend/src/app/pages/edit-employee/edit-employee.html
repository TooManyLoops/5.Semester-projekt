<div class="page">

    <h1>Redigere medarbejdere</h1>

    <form class="employee-form" (ngSubmit)="updateEmployee()">

        <div class="form-row">
            <label>First name</label>
            <input type="text" [(ngModel)]="employee.firstName" name="firstName">
        </div>

        <div class="form-row">
            <label>Last name</label>
            <input type="text" [(ngModel)]="employee.lastName" name="lastName">
        </div>

        <div class="form-row">
            <label>Email</label>
            <input type="text" [(ngModel)]="employee.email" name="email">
        </div>

        <div class="form-row">
            <label>Phone number</label>
            <input type="text" [(ngModel)]="employee.phoneNumber" name="phoneNumber">
        </div>

        <div class="form-row">
            <label>Status</label>

            <select [(ngModel)]="employee.employeeStatus" name="employeeStatus">
                <option [ngValue]="1">Active</option>
                <option [ngValue]="2">Inactive</option>
                <option [ngValue]="3">Terminated</option>
                <option [ngValue]="4">On Leave</option>
            </select>
        </div>

        <div class="button-row">
            <button type="submit">Save changes</button>
        </div>

    </form>

</div>
