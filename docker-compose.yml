services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  bff-api:
    build:
      context: .
      dockerfile: services/Bff.Api/Dockerfile
    container_name: bff-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      FRONTEND_ORIGIN: "http://localhost:62892;http://127.0.0.1:62892"
      EMPLOYEES_API_URL: "http://employees-api:8080"
      SHIFTS_API_URL: "http://shifts-api:8080"
    ports:
      - "5000:8080"
    depends_on:
      - employees-api
      - shifts-api
    networks:
      - backend

  employees-api:
    build:
      context: .
      dockerfile: services/Employees.Api/Dockerfile
    container_name: employees-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      CONNECTION_STRING_EMPLOYEE: ${CONNECTION_STRING_EMPLOYEE}
      FRONTEND_ORIGIN: "http://localhost:62892;http://127.0.0.1:62892"
    ports:
      - "5001:8080"
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - backend

  shifts-api:
    build:
      context: .
      dockerfile: services/Shifts.Api/Dockerfile
    container_name: shifts-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      CONNECTION_STRING_SHIFT: ${CONNECTION_STRING_SHIFT}
      FRONTEND_ORIGIN: "http://localhost:62892;http://127.0.0.1:62892"
    ports:
      - "5002:8080"
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - backend

volumes:
  mssql_data:

networks:
  backend:
